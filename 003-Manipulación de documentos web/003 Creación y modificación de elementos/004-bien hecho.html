<!doctype html>
<html>
  <head>
  </head>
  <body>
    <section>
      <!-- aquí dentro no hay nada -->
    </section>
    <script>
      // Quiero añadir elementos dinámicamente
      let seccion = document.querySelector("section")
      for(let contador = 0;contador<20;contador++){
        ////////// creo los elementos en memoria /////////////////
        // Primero creo un artículo en la memoria
        let articulo = document.createElement("article")
        // Luego creo un titulo en la memoria
        let titulo = document.createElement("h3")
        // Ahora creo un texto en la memoria
        let texto = document.createElement("p")
        ////////// ahora les doy contenido /////////////////
        titulo.textContent = "Yo soy un título"
        texto.textContent = "Yo soy un texto"
        ////////// empaqueto y asigno /////////////////
        articulo.appendChild(titulo)
        articulo.appendChild(texto)
        seccion.appendChild(articulo)
        
      }
    </script>
  </body>
</html>
