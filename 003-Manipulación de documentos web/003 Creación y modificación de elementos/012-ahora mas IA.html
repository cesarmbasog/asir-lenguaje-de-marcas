
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Agenda</title>

  <style>
    :root {
      --marron: #a87552;
      --marron-oscuro: #795238;
      --marron-claro: #ead2bd;
      --beige: #fff5ec;
      --fondo: #ffffff;
      --texto: #44352e;
      --gris: #927f73;
      --borde: #f0dfd2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 25px;
    }

    header {
      background: linear-gradient(120deg, #8f6145, #bd906f, #dfb99a);
      color: white;
      padding: 35px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px #a8755230;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 10px 0 0;
      opacity: 0.9;
    }

    #contador {
      background: #ffffff35;
      border: 1px solid #ffffff60;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: bold;
      white-space: nowrap;
    }

    .panel {
      background: #fffaf6;
      padding: 25px;
      border-radius: 18px;
      margin-bottom: 22px;
      border: 1px solid var(--borde);
      box-shadow: 0 5px 20px #a8755210;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 20px;
      color: var(--marron-oscuro);
    }

    .subtitulo {
      color: var(--gris);
      font-size: 14px;
      margin: 0 0 22px;
    }

    form {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    input, select {
      width: 100%;
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--borde);
      border-radius: 10px;
      background: white;
      color: var(--texto);
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--marron);
      box-shadow: 0 0 0 3px #a8755220;
    }

    input::placeholder {
      color: #b6a398;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      background: var(--marron);
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: var(--marron-oscuro);
      transform: translateY(-2px);
    }

    #guardar {
      grid-column: 1 / -1;
    }

    #cancelar {
      grid-column: 1 / -1;
      display: none;
      background: #f1dfd0;
      color: var(--marron-oscuro);
    }

    .herramientas {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }

    #buscador {
      flex: 1;
    }

    #orden {
      width: 190px;
    }

    #contactos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .contacto {
      border: 1px solid var(--borde);
      border-radius: 16px;
      padding: 20px;
      background: white;
      transition: 0.25s;
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-width: 0;
    }

    .contacto:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px #a8755220;
      border-color: #d8b69c;
    }

    .cabecera-contacto {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 55px;
      height: 55px;
      flex-shrink: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, #e3b99b, #a87552);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: bold;
      box-shadow: 0 4px 10px #a8755230;
    }

    .nombre {
      font-size: 17px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .datos {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dato {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 13px;
      color: var(--gris);
      overflow-wrap: anywhere;
    }

    .icono {
      color: var(--marron);
      font-size: 16px;
      width: 20px;
      flex-shrink: 0;
      text-align: center;
    }

    .dato a {
      color: inherit;
      text-decoration: none;
    }

    .dato a:hover {
      color: var(--marron);
      text-decoration: underline;
    }

    .acciones {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--borde);
    }

    .acciones button,
    .acciones a {
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      background: #fff1e6;
      color: var(--marron-oscuro);
      text-decoration: none;
      border: 1px solid #f0d8c5;
      cursor: pointer;
    }

    .acciones button:hover,
    .acciones a:hover {
      background: #f5dfce;
    }

    .acciones .eliminar {
      background: #fff0ed;
      color: #d65b52;
      border-color: #ffdbd5;
    }

    .acciones .eliminar:hover {
      background: #ffded8;
    }

    .vacio {
      grid-column: 1 / -1;
      padding: 50px;
      text-align: center;
      color: var(--gris);
      background: var(--beige);
      border: 2px dashed #e8cbb5;
      border-radius: 15px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--gris);
      font-size: 12px;
    }

    @media (max-width: 950px) {
      form {
        grid-template-columns: repeat(2, 1fr);
      }

      #contactos {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      main {
        padding: 12px;
      }

      header {
        padding: 25px;
        flex-direction: column;
        align-items: flex-start;
      }

      h1 {
        font-size: 26px;
      }

      form, #contactos {
        grid-template-columns: 1fr;
      }

      .herramientas {
        flex-direction: column;
      }

      #orden {
        width: 100%;
      }

      .panel {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <main>

    <header>
      <div>
        <h1>◫ Mi Agenda</h1>
        <p>Organiza tus contactos de forma sencilla y elegante</p>
      </div>

      <div id="contador">0 contactos</div>
    </header>

    <section class="panel">

      <h2 id="titulo-formulario">＋ Añadir nuevo contacto</h2>

      <p class="subtitulo">
        Completa los datos para guardar un contacto en tu agenda.
      </p>

      <form id="formulario">

        <input
          type="text"
          id="nombre"
          placeholder="Nombre completo"
          required
        >

        <input
          type="email"
          id="email"
          placeholder="Correo electrónico"
          required
        >

        <input
          type="tel"
          id="telefono"
          placeholder="Teléfono"
          required
        >

        <input
          type="text"
          id="direccion"
          placeholder="Dirección"
          required
        >

        <button type="submit" id="guardar">
          ＋ Añadir contacto
        </button>

        <button type="button" id="cancelar">
          Cancelar edición
        </button>

      </form>

    </section>

    <section class="panel">

      <h2>Mis contactos</h2>

      <p class="subtitulo">
        Busca, consulta y administra tu agenda.
      </p>

      <div class="herramientas">

        <input
          type="search"
          id="buscador"
          placeholder="Buscar por nombre, email, teléfono o dirección..."
        >

        <select id="orden">
          <option value="asc">Nombre (A-Z)</option>
          <option value="desc">Nombre (Z-A)</option>
        </select>

      </div>

      <div id="contactos"></div>

    </section>

    <footer>
      Mi Agenda · JavaScript · Array de objetos
    </footer>

  </main>

  <script>

    // ============================================
    // 1. CREO UNA AGENDA VACÍA
    // ============================================

    let agenda = [];


    // ============================================
    // 2. AÑADO CONTACTOS COMO OBJETOS
    // ============================================

    agenda.push({
      "nombre": "César Enrique",
      "email": "cesarmbasogo@gmail.com",
      "telefono": "600 123 456",
      "direccion": "Valencia"
    });

    agenda.push({
      "nombre": "Chris",
      "email": "chrismabsogo@gmail.com",
      "telefono": "611 987 654",
      "direccion": "Madrid"
    });


    // ============================================
    // 3. REFERENCIAS A ELEMENTOS HTML
    // ============================================

    const contenedor = document.querySelector("#contactos");
    const contador = document.querySelector("#contador");
    const buscador = document.querySelector("#buscador");
    const orden = document.querySelector("#orden");
    const formulario = document.querySelector("#formulario");

    const campoNombre = document.querySelector("#nombre");
    const campoEmail = document.querySelector("#email");
    const campoTelefono = document.querySelector("#telefono");
    const campoDireccion = document.querySelector("#direccion");

    const botonGuardar = document.querySelector("#guardar");
    const botonCancelar = document.querySelector("#cancelar");
    const tituloFormulario = document.querySelector("#titulo-formulario");

    // Indica qué contacto estamos editando
    let indiceEdicion = -1;


    // ============================================
    // 4. OBTENER INICIALES DE UN NOMBRE
    // ============================================

    function obtenerIniciales(nombre) {

      return nombre
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(palabra => palabra.charAt(0))
        .join("")
        .toUpperCase();

    }


    // ============================================
    // 5. CREAR UN ELEMENTO HTML CON TEXTO
    // ============================================

    function crearElemento(etiqueta, clase, texto) {

      let elemento = document.createElement(etiqueta);

      elemento.className = clase;
      elemento.textContent = texto;

      return elemento;

    }


    // ============================================
    // 6. CREAR UNA FILA DE INFORMACIÓN
    // ============================================

    function crearDato(icono, valor, enlace = null) {

      let fila = document.createElement("div");
      fila.className = "dato";

      let simbolo = crearElemento("span", "icono", icono);

      let contenido;

      if (enlace !== null) {

        contenido = document.createElement("a");
        contenido.href = enlace;
        contenido.textContent = valor;

        // Para enlaces de Google Maps
        if (enlace.startsWith("https://")) {
          contenido.target = "_blank";
          contenido.rel = "noopener noreferrer";
        }

      } else {

        contenido = document.createElement("span");
        contenido.textContent = valor;

      }

      fila.appendChild(simbolo);
      fila.appendChild(contenido);

      return fila;

    }


    // ============================================
    // 7. DIBUJAR LA AGENDA
    // ============================================

    function dibujarAgenda() {

      // Limpio la zona de contactos
      contenedor.innerHTML = "";

      // Obtengo el texto del buscador
      let busqueda = buscador.value.toLowerCase();

      // Conservo el índice original de cada contacto
      let resultados = agenda.map(function(contacto, indice) {

        return {
          contacto: contacto,
          indice: indice
        };

      });

      // Filtro los contactos
      resultados = resultados.filter(function(elemento) {

        let contacto = elemento.contacto;

        return (
          contacto.nombre.toLowerCase().includes(busqueda) ||
          contacto.email.toLowerCase().includes(busqueda) ||
          contacto.telefono.toLowerCase().includes(busqueda) ||
          contacto.direccion.toLowerCase().includes(busqueda)
        );

      });

      // Ordeno los resultados
      resultados.sort(function(a, b) {

        let comparacion = a.contacto.nombre.localeCompare(
          b.contacto.nombre,
          "es"
        );

        return orden.value === "asc"
          ? comparacion
          : -comparacion;

      });

      // Actualizo el contador
      contador.textContent = agenda.length + " contactos";

      // Compruebo si hay resultados
      if (resultados.length === 0) {

        let mensaje = crearElemento(
          "div",
          "vacio",
          "No hay contactos que mostrar"
        );

        contenedor.appendChild(mensaje);

        return;
      }

      // Recorro los contactos filtrados
      resultados.forEach(function(elemento) {

        let contacto = elemento.contacto;
        let indice = elemento.indice;

        // Creo la tarjeta
        let tarjeta = document.createElement("article");
        tarjeta.className = "contacto";

        // Cabecera de la tarjeta
        let cabecera = document.createElement("div");
        cabecera.className = "cabecera-contacto";

        // Avatar
        let avatar = crearElemento(
          "div",
          "avatar",
          obtenerIniciales(contacto.nombre)
        );

        // Nombre
        let nombre = crearElemento(
          "div",
          "nombre",
          contacto.nombre
        );

        cabecera.appendChild(avatar);
        cabecera.appendChild(nombre);

        // Contenedor de datos
        let datos = document.createElement("div");
        datos.className = "datos";

        // Email
        datos.appendChild(
          crearDato(
            "✉",
            contacto.email,
            "mailto:" + contacto.email
          )
        );

        // Teléfono
        datos.appendChild(
          crearDato(
            "☎",
            contacto.telefono,
            "tel:" + contacto.telefono
          )
        );

        // Dirección
        datos.appendChild(
          crearDato(
            "⌖",
            contacto.direccion,
            "https://www.google.com/maps/search/?api=1&query=" +
              encodeURIComponent(contacto.direccion)
          )
        );

        // Contenedor de botones
        let acciones = document.createElement("div");
        acciones.className = "acciones";

        // Botón llamar
        let llamar = document.createElement("a");
        llamar.href = "tel:" + contacto.telefono;
        llamar.textContent = "☎ Llamar";

        // Botón email
        let enviarEmail = document.createElement("a");
        enviarEmail.href = "mailto:" + contacto.email;
        enviarEmail.textContent = "✉ Email";

        // Botón editar
        let editar = document.createElement("button");
        editar.type = "button";
        editar.textContent = "✎ Editar";

        editar.onclick = function() {
          editarContacto(indice);
        };

        // Botón eliminar
        let eliminar = document.createElement("button");
        eliminar.type = "button";
        eliminar.className = "eliminar";
        eliminar.textContent = "✕ Eliminar";

        eliminar.onclick = function() {
          eliminarContacto(indice);
        };

        acciones.appendChild(llamar);
        acciones.appendChild(enviarEmail);
        acciones.appendChild(editar);
        acciones.appendChild(eliminar);

        // Construyo la tarjeta
        tarjeta.appendChild(cabecera);
        tarjeta.appendChild(datos);
        tarjeta.appendChild(acciones);

        // Añado la tarjeta al HTML
        contenedor.appendChild(tarjeta);

      });

    }


    // ============================================
    // 8. AÑADIR O GUARDAR UN CONTACTO
    // ============================================

    formulario.onsubmit = function(evento) {

      evento.preventDefault();

      // Creo un objeto con los valores del formulario
      let contacto = {
        "nombre": campoNombre.value.trim(),
        "email": campoEmail.value.trim(),
        "telefono": campoTelefono.value.trim(),
        "direccion": campoDireccion.value.trim()
      };

      if (indiceEdicion === -1) {

        // Añado un nuevo objeto al array
        agenda.push(contacto);

      } else {

        // Sustituyo el objeto que estaba editando
        agenda[indiceEdicion] = contacto;

      }

      // Limpio el formulario
      limpiarFormulario();

      // Actualizo la interfaz
      dibujarAgenda();

      // Muestro el array actualizado
      console.log(agenda);

    };


    // ============================================
    // 9. EDITAR UN CONTACTO
    // ============================================

    function editarContacto(indice) {

      // Guardo el índice que estoy editando
      indiceEdicion = indice;

      // Recupero el objeto del array
      let contacto = agenda[indice];

      // Relleno el formulario
      campoNombre.value = contacto.nombre;
      campoEmail.value = contacto.email;
      campoTelefono.value = contacto.telefono;
      campoDireccion.value = contacto.direccion;

      // Cambio los textos
      tituloFormulario.textContent = "✎ Editar contacto";
      botonGuardar.textContent = "Guardar cambios";

      // Muestro cancelar
      botonCancelar.style.display = "block";

      // Desplazo la página al formulario
      formulario.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }


    // ============================================
    // 10. ELIMINAR UN CONTACTO
    // ============================================

    function eliminarContacto(indice) {

      let contacto = agenda[indice];

      let confirmar = confirm(
        "¿Quieres eliminar a " + contacto.nombre + "?"
      );

      if (confirmar) {

        // Elimino el objeto del array
        agenda.splice(indice, 1);

        // Evito que una edición pendiente use
        // un índice que ya no corresponde
        limpiarFormulario();

        // Actualizo la pantalla
        dibujarAgenda();

        console.log(agenda);

      }

    }


    // ============================================
    // 11. LIMPIAR FORMULARIO
    // ============================================

    function limpiarFormulario() {

      formulario.reset();

      indiceEdicion = -1;

      tituloFormulario.textContent = "＋ Añadir nuevo contacto";
      botonGuardar.textContent = "＋ Añadir contacto";
      botonCancelar.style.display = "none";

    }


    // ============================================
    // 12. CANCELAR EDICIÓN
    // ============================================

    botonCancelar.onclick = function() {

      limpiarFormulario();

    };


    // ============================================
    // 13. BUSCADOR EN TIEMPO REAL
    // ============================================

    buscador.oninput = function() {

      dibujarAgenda();

    };


    // ============================================
    // 14. ORDENAR CONTACTOS
    // ============================================

    orden.onchange = function() {

      dibujarAgenda();

    };


    // ============================================
    // 15. DIBUJAR AL CARGAR LA PÁGINA
    // ============================================

    dibujarAgenda();

    console.log("Agenda inicial:", agenda);

  </script>

</body>
</html>
