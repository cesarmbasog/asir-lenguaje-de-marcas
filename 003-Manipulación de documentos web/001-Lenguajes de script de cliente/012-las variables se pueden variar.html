<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
  </head>
  <body>
    <script>
      // Primero declaro la edad
      let edad = 25;
      // Ahora declaro el nombre
      let nombre = "César Enrique"
      // Saco por pantalla tanto la edad como el nombre
      document.write("Me llamo ",nombre," y tengo ",edad," años")
      // Ahora creo una variable doble y le pongo el doble de la edad
      let doble = edad * 2
      // Y lo vuelvo a sacar por pantalla
      document.write("El doble de mi edad es: ",doble," años")
      // Ahora cambio el valor de la variable
      edad = 26
      // Saco por pantalla tanto la edad como el nombre
      document.write("Me llamo ",nombre," y tengo ",edad," años")
      // Ahora creo una variable doble y le pongo el doble de la edad
      doble = edad * 2
      // Y lo vuelvo a sacar por pantalla
      document.write("El doble de mi edad es: ",doble," años")
    </script>
  </body>
</html>
