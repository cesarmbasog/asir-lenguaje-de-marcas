
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadoras</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    font-family: Arial, sans-serif;
    background: #080d18;
    color: #f1f5f9;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

header h1 {
    color: #60a5fa;
}

nav {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

nav button {
    background: #1e293b;
    color: white;
    border: 1px solid #334155;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
}

nav button:hover,
nav button.activo {
    background: #2563eb;
}

main {
    max-width: 430px;
    margin: auto;
}

.panel {
    display: none;
    background: #111a2b;
    padding: 25px;
    border: 1px solid #26344b;
    border-radius: 16px;
    box-shadow: 0 10px 30px #00000030;
}

.panel.activo {
    display: block;
}

h2 {
    color: #60a5fa;
    text-align: center;
}

label {
    display: block;
    margin: 18px 0 8px;
}

input {
    width: 100%;
    padding: 13px;
    background: #080d18;
    border: 1px solid #334155;
    border-radius: 8px;
    color: white;
    font-size: 16px;
}

button {
    font-size: 15px;
}

.calcular {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: #2563eb;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}

.calcular:hover {
    background: #3b82f6;
}

#resultadoIMC {
    margin-top: 20px;
    padding: 15px;
    background: #080d18;
    border-radius: 10px;
    text-align: center;
    display: none;
}

#valorIMC {
    color: #60a5fa;
    font-size: 32px;
    font-weight: bold;
}

#pantalla {
    width: 100%;
    height: 65px;
    margin-bottom: 15px;
    text-align: right;
    font-size: 26px;
}

.teclas {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.teclas button {
    min-width: 0;
    padding: 15px 2px;
    background: #263449;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.teclas button:hover {
    background: #3b4d66;
}

.teclas .operador {
    background: #174ea6;
}

.teclas .borrar {
    background: #9f303b;
}

.teclas .igual {
    background: #16805d;
}

.nota {
    color: #94a3b8;
    font-size: 12px;
    text-align: center;
    margin-top: 20px;
}
</style>
</head>

<body>

<header>
    <h1>Calculadoras</h1>
    <p>Herramientas para tus cálculos diarios</p>
</header>

<nav>
    <button class="activo" onclick="mostrar('imc', this)">
        Calculadora IMC
    </button>
    <button onclick="mostrar('cientifica', this)">
        Calculadora científica
    </button>
</nav>

<main>

    <!-- CALCULADORA IMC -->
    <section id="imc" class="panel activo">
        <h2>Índice de masa corporal</h2>
        <p>Introduce tus datos para calcular tu IMC.</p>

        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" placeholder="Ej. 70" min="0" step="any">

        <label for="altura">Altura (metros)</label>
        <input type="number" id="altura" placeholder="Ej. 1.75" min="0" step="any">

        <button class="calcular" onclick="calcularIMC()">
            Calcular IMC
        </button>

        <div id="resultadoIMC">
            <p>Tu resultado es:</p>
            <div id="valorIMC"></div>
            <p id="clasificacion"></p>
        </div>

        <p class="nota">Orientativo para adultos. No sustituye una valoración médica.</p>
    </section>

    <!-- CALCULADORA CIENTIFICA -->
    <section id="cientifica" class="panel">
        <h2>Calculadora científica</h2>

        <input id="pantalla" type="text" value="0"
               aria-label="Pantalla de la calculadora"
               readonly>

        <div class="teclas">
            <button class="borrar" onclick="limpiar()">AC</button>
            <button onclick="borrarUltimo()">DEL</button>
            <button class="operador" onclick="agregar('(')">(</button>
            <button class="operador" onclick="agregar(')')">)</button>

            <button onclick="funcion('sin')">sin</button>
            <button onclick="funcion('cos')">cos</button>
            <button onclick="funcion('tan')">tan</button>
            <button class="operador" onclick="agregar('/')">÷</button>

            <button onclick="funcion('sqrt')">√</button>
            <button onclick="agregar('^2')">x²</button>
            <button onclick="agregar('^')">xʸ</button>
            <button class="operador" onclick="agregar('*')">×</button>

            <button onclick="agregar('7')">7</button>
            <button onclick="agregar('8')">8</button>
            <button onclick="agregar('9')">9</button>
            <button class="operador" onclick="agregar('-')">−</button>

            <button onclick="agregar('4')">4</button>
            <button onclick="agregar('5')">5</button>
            <button onclick="agregar('6')">6</button>
            <button class="operador" onclick="agregar('+')">+</button>

            <button onclick="agregar('1')">1</button>
            <button onclick="agregar('2')">2</button>
            <button onclick="agregar('3')">3</button>
            <button onclick="agregar('.')">.</button>

            <button onclick="agregar('0')">0</button>
            <button onclick="agregar('pi')">π</button>
            <button onclick="agregar('e')">e</button>
            <button class="igual" onclick="calcular()">=</button>
        </div>

        <p class="nota">Trigonometría en grados. Usa AC para reiniciar.</p>
    </section>

</main>

<script>
function mostrar(id, boton) {
    document.querySelectorAll(".panel").forEach(function(panel) {
        panel.classList.remove("activo");
    });

    document.querySelectorAll("nav button").forEach(function(b) {
        b.classList.remove("activo");
    });

    document.getElementById(id).classList.add("activo");
    boton.classList.add("activo");
}

function calcularIMC() {
    let peso = parseFloat(document.getElementById("peso").value);
    let altura = parseFloat(document.getElementById("altura").value);

    if (!Number.isFinite(peso) || !Number.isFinite(altura) ||
        peso <= 0 || altura <= 0) {
        alert("Introduce un peso y una altura válidos.");
        return;
    }

    let imc = peso / (altura * altura);
    let texto;

    if (imc < 18.5) {
        texto = "Peso inferior al rango de referencia";
    } else if (imc < 25) {
        texto = "Peso dentro del rango de referencia";
    } else if (imc < 30) {
        texto = "Sobrepeso según el IMC";
    } else {
        texto = "Obesidad según el IMC";
    }

    document.getElementById("valorIMC").textContent = imc.toFixed(2);
    document.getElementById("clasificacion").textContent = texto;
    document.getElementById("resultadoIMC").style.display = "block";
}

let expresion = "";
let nuevoNumero = false;

function actualizarPantalla() {
    document.getElementById("pantalla").value = expresion || "0";
}

function agregar(valor) {
    if (nuevoNumero && /[0-9.]|pi|e/.test(valor)) {
        expresion = "";
        nuevoNumero = false;
    }

    expresion += valor;
    actualizarPantalla();
}

function limpiar() {
    expresion = "";
    nuevoNumero = false;
    actualizarPantalla();
}

function borrarUltimo() {
    expresion = expresion.slice(0, -1);
    actualizarPantalla();
}

function funcion(nombre) {
    if (nombre === "sqrt") {
        expresion += "sqrt(";
    } else {
        expresion += nombre + "(";
    }
    nuevoNumero = false;
    actualizarPantalla();
}

/* Analizador matemático sin ejecutar código JavaScript arbitrario */
function calcular() {
    try {
        let tokens = expresion.match(
            /(?:\d+\.?\d*|\.\d+)|pi|sqrt|sin|cos|tan|log|ln|e|[()+\-*/^]/gi
        ) || [];

        let reconstruida = tokens.join("");
        let compacta = expresion.replace(/\s/g, "");

        if (!compacta || reconstruida.toLowerCase() !== compacta.toLowerCase()) {
            throw Error();
        }

        let i = 0;

        function primaria() {
            let t = tokens[i++];

            if (t === "+") return primaria();
            if (t === "-") return -primaria();

            if (t === "(") {
                let v = suma();
                if (tokens[i++] !== ")") throw Error();
                return v;
            }

            if (["sin", "cos", "tan", "sqrt", "log", "ln"].includes(
                String(t).toLowerCase()
            )) {
                let nombre = t.toLowerCase();
                if (tokens[i++] !== "(") throw Error();
                let v = suma();
                if (tokens[i++] !== ")") throw Error();

                if (nombre === "sqrt") return Math.sqrt(v);
                if (nombre === "sin") return Math.sin(v * Math.PI / 180);
                if (nombre === "cos") return Math.cos(v * Math.PI / 180);
                if (nombre === "tan") return Math.tan(v * Math.PI / 180);
                if (nombre === "log") return Math.log10(v);
                if (nombre === "ln") return Math.log(v);
            }

            if (String(t).toLowerCase() === "pi") return Math.PI;
            if (String(t).toLowerCase() === "e") return Math.E;

            let n = Number(t);
            if (!Number.isFinite(n)) throw Error();
            return n;
        }

        function potencia() {
            let a = primaria();
            if (tokens[i] === "^") {
                i++;
                a = Math.pow(a, potencia());
            }
            return a;
        }

        function producto() {
            let a = potencia();
            while (tokens[i] === "*" || tokens[i] === "/") {
                let op = tokens[i++];
                let b = potencia();
                a = op === "*" ? a * b : a / b;
            }
            return a;
        }

        function suma() {
            let a = producto();
            while (tokens[i] === "+" || tokens[i] === "-") {
                let op = tokens[i++];
                let b = producto();
                a = op === "+" ? a + b : a - b;
            }
            return a;
        }

        let resultado = suma();

        if (i !== tokens.length || !Number.isFinite(resultado)) {
            throw Error();
        }

        expresion = String(Number(resultado.toPrecision(12)));
        nuevoNumero = true;
        actualizarPantalla();

    } catch (error) {
        document.getElementById("pantalla").value = "Error";
        expresion = "";
        nuevoNumero = true;
    }
}
</script>

</body>
</html>
