<!doctype html>
<html>

  </head>
  <body>
    <section>
      <article>
        <h3>Esto es un titulo</h3>
        <p>Y esto es un texto</p>
      </article>
    </section>
    <script>
      // Primero selecciono el elemento que quiero eliminar
      let articulo = document.querySelector("article")
      // Y ahora lo simplemente lo escondo
      articulo.style.display = "none"
      
    </script>
  </body>
</html>
