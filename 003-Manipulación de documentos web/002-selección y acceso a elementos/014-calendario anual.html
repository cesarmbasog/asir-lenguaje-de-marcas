<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Anual</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #080d18;
            color: white;
            margin: 0;
            padding: 30px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #60a5fa;
        }

        .controles {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 25px 0;
        }

        .controles button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        .controles button:hover {
            background: #3b82f6;
        }

        #año {
            font-size: 28px;
            font-weight: bold;
            color: #93c5fd;
        }

        #calendario {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .mes {
            background: #172033;
            padding: 15px;
            border: 1px solid #29364d;
            border-radius: 12px;
        }

        .mes h2 {
            text-align: center;
            color: #60a5fa;
            font-size: 18px;
            margin-top: 5px;
        }

        .dias {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .semana {
            text-align: center;
            color: #93c5fd;
            font-size: 11px;
            font-weight: bold;
            padding: 7px 0;
        }

        .dia {
            text-align: center;
            padding: 8px 0;
            background: #0f172a;
            border-radius: 5px;
            font-size: 12px;
        }

        .dia:hover {
            background: #2563eb;
        }

        .vacio {
            background: transparent;
        }

        .hoy {
            background: #2563eb;
            color: white;
            font-weight: bold;
            outline: 2px solid #93c5fd;
        }

        .mes-actual {
            border: 1px solid #3b82f6;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 800px) {
            #calendario {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            #calendario {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Calendario Anual</h1>
    <p>Consulta todos los días del año en una sola página.</p>

    <div class="controles">
        <button onclick="cambiarAño(-1)">❮</button>
        <span id="año"></span>
        <button onclick="cambiarAño(1)">❯</button>
    </div>
</header>

<main>
    <div id="calendario"></div>
</main>

<footer>
    Calendario anual · Organiza tu tiempo
</footer>

<script>
    let calendario = document.querySelector("#calendario");
    let añoElemento = document.querySelector("#año");

    let fechaActual = new Date();
    let año = fechaActual.getFullYear();

    let meses = [
        "Enero", "Febrero", "Marzo",
        "Abril", "Mayo", "Junio",
        "Julio", "Agosto", "Septiembre",
        "Octubre", "Noviembre", "Diciembre"
    ];

    let diasSemana = [
        "L", "M", "X", "J", "V", "S", "D"
    ];

    function generarCalendario() {

        calendario.innerHTML = "";
        añoElemento.textContent = año;

        // Recorremos los 12 meses
        for (let mes = 0; mes < 12; mes++) {

            let contenido = '<section class="mes">';

            contenido += '<h2>' + meses[mes] + '</h2>';
            contenido += '<div class="dias">';

            // Pintamos los días de la semana
            for (let dia of diasSemana) {
                contenido += '<div class="semana">' + dia + '</div>';
            }

            // Calculamos el primer día del mes
            let primerDia = new Date(año, mes, 1).getDay();

            // Ajustamos para empezar en lunes
            primerDia = (primerDia + 6) % 7;

            // Calculamos el número de días del mes
            let diasMes = new Date(año, mes + 1, 0).getDate();

            // Añadimos espacios vacíos
            for (let i = 0; i < primerDia; i++) {
                contenido += '<div class="dia vacio"></div>';
            }

            // Pintamos los días
            for (let dia = 1; dia <= diasMes; dia++) {

                let clase = "dia";

                // Comprobamos si es el día actual
                if (
                    dia === fechaActual.getDate() &&
                    mes === fechaActual.getMonth() &&
                    año === fechaActual.getFullYear()
                ) {
                    clase += " hoy";
                }

                contenido +=
                    '<div class="' + clase + '">' + dia + '</div>';
            }

            contenido += '</div></section>';

            calendario.innerHTML += contenido;
        }
    }

    // Cambiar de año
    function cambiarAño(cantidad) {
        año += cantidad;
        generarCalendario();
    }

    // Mostrar el calendario al cargar la página
    generarCalendario();

</script>

</body>
</html>
