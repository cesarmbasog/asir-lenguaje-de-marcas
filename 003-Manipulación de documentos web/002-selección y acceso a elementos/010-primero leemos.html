<!doctype html>
<html>
  <head>
    <style>
      #calendario{width:600px;height:400px;border:2px solid black;
      display:grid;grid-template-columns:repeat(7,1fr);}
      .dia{border:1px solid grey;}
    </style>
  </head>
  <body>
    <div id="calendario">
      Este es un contenido estático
    </div>
    <script>
      // Primero selecciono un elemento del documento que tenga el id calendario
      let calendario = document.querySelector("#calendario")
      // Luego leo su texto
      let texto = calendario.textContent
      // Ahora lo pinto en pantalla
      document.write(texto)
    </script>
  </body>
</html>
