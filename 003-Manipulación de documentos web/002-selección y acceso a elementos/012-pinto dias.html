<!doctype html>
<html>
  <head>
    <style>
      #calendario{width:600px;height:400px;border:2px solid black;
      display:grid;grid-template-columns:repeat(7,1fr);}
      .dia{border:1px solid grey;}
    </style>
  </head>
  <body>
    <div id="calendario">
    </div>
    <script>
      // Primero selecciono un elemento del documento que tenga el id calendario
      let calendario = document.querySelector("#calendario")
      // Repito algo 30 veces
      for(let dia = 1;dia <= 30;dia++){
        // += quiere decir "lo que tenias, y algo mas"
        // Y por cada una de esas 30 veces te pinto un dia
      	calendario.innerHTML += '<div class="dia">'+dia+'</div>'
      }
    </script>
  </body>
</html>
