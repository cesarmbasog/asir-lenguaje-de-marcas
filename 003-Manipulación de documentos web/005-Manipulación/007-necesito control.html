<!doctype html>
<html>
	<head>
	</head>
	<body> 
    <header>
      <h1>El blog de César</h1>
    </header>
    <main>
      <!-- Lo que quiero es que los articulos vayan aqui -->
    </main>
    <footer>
      (c) 2026 César Enrique
    </footer>
    <!-- Aqui quiero poner los datos -->
		<script>
			fetch("articulos.json") 		// Traeme el archivo articulos.json
			.then(function(retorno){return retorno.json()}) // Viene como JSON
			.then(function(datos){ 									// Cuando lleguen los datos
				console.log(datos)										// Pintamelos en la consola
        datos.forEach(function(articulo){ 		// Para cada articulo en los datos
        	document.write("<h3>"+articulo.titulo+"</h3>")			// Pinto a lo bestia el titulo
          document.write("<time>"+articulo.fecha+"</time>")			// Pinto a lo bestia la fecha
          document.write("<p>"+articulo.contenido+"</p>")	// Pinto a lo bestia el contenido
        })
			})
		</script>
	</body>
</html>
